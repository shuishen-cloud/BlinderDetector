# 灵眸伴途 —— nginx 前置：TLS 终结 + WebSocket 转发
#
# ★ 这个文件存在的**唯一硬理由**是 HTTPS。浏览器只在 secure context 下
#   暴露 `getUserMedia`，站点跑在明文 HTTP 上时麦克风和摄像头被直接拒掉
#   （`web/js/voice.js::whyUnavailable` 里那句「语音输入需要 HTTPS 或
#   localhost，请换地址打开」说的就是这件事）。语音是这个项目的入口 ——
#   没有 HTTPS 就没有服务，不是「体验差一点」。
#
# 挂载位置：/etc/nginx/conf.d/default.conf（见 docker-compose.yml）。

upstream blinderdetector {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ★ 证书续期要走这条，且必须放在 301 之前 —— 被 301 掉的话
    #   certbot 的 http-01 校验永远过不去。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ★ 手机拍的视频是从这儿整个 POST 上来的。默认 1m 会撞 413，
    #   而且报错长得像前端的问题，不在 nginx 上找会找很久。
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 播报下发的主通道。不转发 Upgrade 头的话握手直接 400，而页面其余
    #   部分看起来完全正常 —— 只有播报不出声，最难查的那种坏法。
    location /v1/stream {
        proxy_pass http://blinderdetector;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 两句话之间可以静默很久，别让 nginx 把连接掐了。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://blinderdetector;
        # 感知层最慢的那个实现是 8 秒超时（VLM_TIMEOUT_MS），60 秒够它降级回包。
        proxy_read_timeout 60s;
    }
}
