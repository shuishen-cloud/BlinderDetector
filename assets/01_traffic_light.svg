<?xml version="1.0" encoding="UTF-8"?>
<!-- 场景：前方路口，红灯。对应第一层的「前方约 3 米有一个红绿灯，现在是红灯」 -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- 天空 -->
  <rect x="0" y="0" width="640" height="300" fill="#bfd8ea"/>
  <!-- 远处楼房 -->
  <rect x="20" y="120" width="110" height="180" fill="#9aa7b4"/>
  <rect x="150" y="90" width="90" height="210" fill="#8b98a6"/>
  <rect x="520" y="140" width="100" height="160" fill="#9aa7b4"/>
  <!-- 路面 -->
  <rect x="0" y="300" width="640" height="180" fill="#5c5f63"/>
  <!-- 人行横道 -->
  <rect x="0" y="300" width="16" height="180" fill="#e8e8e8"/>
  <rect x="32" y="300" width="16" height="180" fill="#e8e8e8"/>
  <rect x="64" y="300" width="16" height="180" fill="#e8e8e8"/>
  <rect x="96" y="300" width="16" height="180" fill="#e8e8e8"/>
  <rect x="128" y="300" width="16" height="180" fill="#e8e8e8"/>
  <!-- 红绿灯杆 -->
  <rect x="286" y="150" width="10" height="170" fill="#3d4045"/>
  <!-- 红绿灯箱 -->
  <rect x="268" y="80" width="46" height="112" rx="6" fill="#2b2e33"/>
  <!-- 红灯亮 -->
  <circle cx="291" cy="104" r="14" fill="#e02020"/>
  <circle cx="291" cy="136" r="14" fill="#4a3a1a"/>
  <circle cx="291" cy="168" r="14" fill="#1a3a22"/>
</svg>
