# 灵眸伴途 —— 上线用的两件套：应用 + nginx（TLS 终结）
#
#   docker compose up -d --build
#
# 首次部署（证书、演示素材、密钥）见 deploy/README.md。

services:
  app:
    build: .
    image: blinderdetector:latest
    restart: unless-stopped
    # ★ 密钥从这里进容器，不烤进镜像（.env 在 .dockerignore 里）。
    env_file:
      - .env
    volumes:
      # ★ 演示素材与上传帧都在这里。data/ 是 .gitignore 的，服务器上
      #   要另外把 demo.mp4 / frames 拷进来，否则 sender.html 里的
      #   <video src="/data/demo.mp4"> 是 404（见 deploy/README.md）。
      - ./data:/srv/data
    # ★ 刻意不写 `ports:` —— 应用端口不发布到宿主机，外部只能经 nginx
    #   进来。明文 HTTP 上没有可用的麦克风/摄像头，少一个入口就少一处
    #   让人误连的地址。
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # fullchain.pem + privkey.pem 放这里，**不要提交**（已在 .gitignore）。
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/certbot-www:/var/www/certbot
